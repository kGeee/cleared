<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cleared · Finance</title>
  <link rel="icon" href="/mascot.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/mascot.png" alt="" /><span>CLEARED</span></div>
    <nav class="tabs">
      <span class="tab soon" title="Operations teammate: on the roadmap">Operations</span>
      <span class="tab soon" title="Growth teammate: on the roadmap">Growth</span>
      <span class="tab active">Finance</span>
    </nav>
    <form class="jump" id="jump" autocomplete="off">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="jumpInput" placeholder="Jump to invoice…" />
    </form>
    <div class="conn">
      <div class="working"><small>CONNECTED</small><span id="workingIn">Ready</span></div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <main class="layout">
    <aside class="queue">
      <div class="queue-head">
        <div>
          <h2>Short-pays</h2>
          <button class="srclink" id="srcLink" hidden></button>
        </div>
        <button class="ghost" id="checkAll" title="Investigate every new short-pay">Check all</button>
      </div>
      <div class="filters" id="filters">
        <button data-f="all" class="sel">All</button>
        <button data-f="review">To review</button>
        <button data-f="waiting">Waiting</button>
        <button data-f="closed">Closed</button>
      </div>
      <div class="rows" id="rows"></div>
    </aside>

    <section class="work" id="work"></section>
  </main>

  <footer class="modebar">
    <span id="modeBadge" class="badge"></span>
    <span id="aiBadge" class="badge subtle"></span>
    <span class="spacer"></span>
    <button class="link" id="showConnect">Connections</button>
    <button class="link" id="reset">Reset demo</button>
  </footer>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Document">
      <div class="drawer-head">
        <div><div class="eyebrow" id="dEyebrow"></div><h3 id="dTitle"></h3></div>
        <div class="drawer-actions"><a id="dOpen" class="ghost" target="_blank">Open PDF</a><button class="x" data-close aria-label="Close">✕</button></div>
      </div>
      <div class="drawer-body">
        <iframe id="dFrame" title="Document preview"></iframe>
        <div class="read" id="dRead"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="connect" hidden>
    <div class="connect-card">
      <div class="connect-left">
        <img src="/mascot.png" class="connect-mascot" alt="" />
        <div class="eyebrow light">CLEARED · SETUP · ONE TIME</div>
        <h1>Getting started takes one click.</h1>
        <p>You approve access inside each app itself. Cleared reads what it needs, and nothing is sent or changed until you approve it.</p>
      </div>
      <div class="connect-right" id="connectList"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
